[package]
name = "SymStripe"
version = "1.0.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = "1.18.1"
rfd = "0.17.2"
walkdir = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
widestring = "1.2.1"
winfsp = "0.13.1"
winfsp-sys = "0.12.1"
rayon = "1.12.0"
parking_lot = "0.12.5"
lz4_flex = "0.14.0"
zstd = "0.14.2"
tray-icon = "0.26.1"
winreg = "0.56.0"
windows-service = "0.8.1"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
mimalloc = { version = "0.1.52", default-features = false }

[build-dependencies]
slint-build = "1.18.1"
winfsp = "0.13.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
