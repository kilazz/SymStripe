[package]
name = "SymStripe"
version = "1.0.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = "1.18.1"
rfd = "0.17.2"
walkdir = "2.5.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
